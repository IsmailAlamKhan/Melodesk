[package]
name = "melodesk"
version = "0.1.0"
description = "Melodesk — an open-source native desktop client for YouTube Music (not affiliated with Google or YouTube)"
authors = ["Melodesk contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "melodesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The Tauri CLI passes --no-default-features for `tauri dev` (loads devUrl) and enables
# custom-protocol for `tauri build` (embeds frontendDist).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-sql = { version = "=2.6.0", features = ["sqlite"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
log = "=0.4.29"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
