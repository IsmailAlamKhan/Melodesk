[package]
name = "melodesk"
version = "0.7.0"
description = "Melodesk — an open-source native desktop client for YouTube Music (not affiliated with Google or YouTube)"
authors = ["Melodesk contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "melodesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The Tauri CLI passes --no-default-features for `tauri dev` (loads devUrl) and enables
# custom-protocol for `tauri build` (embeds frontendDist).
default = ["custom-protocol", "discord", "shortcuts"]
custom-protocol = ["tauri/custom-protocol"]
# Optional native modules. The web UI asks `native_modules` which ones this build has and turns the
# features that need the missing ones off. Without a module its commands still exist and answer
# "not available", so nothing else has to change. `tauri.conf.json` lists them in `build.features`
# because `tauri dev` passes --no-default-features.
discord = ["dep:discord-rich-presence"]
shortcuts = ["dep:tauri-plugin-global-shortcut"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-sql = { version = "=2.6.0", features = ["sqlite"] }
tauri-plugin-store = "=2.5.0"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-os = "=2.4.0"
tauri-plugin-process = "=2.4.0"
tauri-plugin-http = "=2.8.3"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
discord-rich-presence = { version = "=1.1.0", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
log = "=0.4.34"
url = "=2.5.8"
lofty = "=0.25.4"
walkdir = "=2.5.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = { version = "=2.4.1", optional = true }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-single-instance = { version = "=2.5.4", features = ["deep-link"] }
tauri-plugin-updater = "=2.14.0"
window-vibrancy = "=0.8.1"

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "=0.8.3", default-features = false, features = ["use_zbus"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
