name: CI

# The repository is public, so runner minutes are free: every push and pull request is checked on
# macOS, Windows and Linux.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:bridge
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm i18n:check
      - run: pnpm prompts:check
      - run: pnpm test
      - run: pnpm features:removable

  e2e:
    name: End-to-end tests (UI against a mocked Tauri backend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:bridge
      - run: pnpm --filter @melodesk/desktop exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/desktop/test-results

  rust:
    name: Clippy, rustfmt, Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:bridge
      - run: pnpm fmt:rust
      - run: pnpm clippy
      # --no-default-features: the default `custom-protocol` feature embeds the built frontend,
      # which does not exist in CI test jobs. The native modules are tested with and without.
      - run: pnpm test:rust
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features
