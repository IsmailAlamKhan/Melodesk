name: Release

# release-please opens/updates a release PR from Conventional Commits; merging it creates the
# tag and GitHub release, which this workflow then fills with the macOS installer (universal
# .dmg), the Windows installers (.msi and NSIS .exe) and the updater manifest (latest.json).
# Nothing is built until that PR is merged.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build and attach installers for this existing release tag (e.g. melodesk-v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # Reads release-please-config.json, which also bumps the version in tauri.conf.json (the
          # updater compares against it) and Cargo.toml. Passing `release-type` here would skip it.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --target universal-apple-darwin
          - os: windows-2022
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      # A step's own `if` cannot see that step's env, so the certificate check reads it from here.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The repository pins its Rust version in rust-toolchain.toml; install that one with the extra
      # targets, or the build installs it bare and cannot build the second macOS architecture.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Import Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      # Signing and notarization settings go into the environment only when the secrets exist: an
      # empty APPLE_SIGNING_IDENTITY makes the build look for an identity named "" and fail. Without
      # them the app is signed ad hoc ("-"), which Apple Silicon needs to run it at all.
      - name: macOS signing settings
        if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID_SECRET" ]; then
              echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
            fi
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The public client id of Melodesk's OAuth app, for "Sign in with GitHub" in settings sync
          # (see docs/settings-sync.md). Set it as a repository variable; without it sign-in is not offered.
          MELODESK_GITHUB_CLIENT_ID: ${{ vars.MELODESK_GITHUB_CLIENT_ID }}
          # The address of your Melodesk sync server (apps/sync-server), built in as the default.
          MELODESK_SYNC_URL: ${{ vars.MELODESK_SYNC_URL }}
          # Updater signing (required for latest.json). Generate with `pnpm tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows code signing is not set up: the installers are unsigned, so SmartScreen warns on
          # first run. See https://v2.tauri.app/distribute/sign/windows/ (a certificate, or Azure
          # Trusted Signing) to add it.
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          releaseName: Melodesk ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
